<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Color Picker & Palette Generator | ColorPickerTool</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & Babel for Single File Execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
            color: #1a1a1a;
            margin: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 8px;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10b981;
        }
        .prose strong {
            color: #10b981;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- Utilities ---
        const hexToRgb = (hex) => {
            if (!hex) return 'rgb(0,0,0)';
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        };

        const processImage = (img) => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            if (!ctx) return [];
            const size = 50;
            canvas.width = size;
            canvas.height = size;
            ctx.drawImage(img, 0, 0, size, size);
            const imageData = ctx.getImageData(0, 0, size, size).data;
            const colorCounts = {};
            for (let i = 0; i < imageData.length; i += 4) {
                const r = Math.round(imageData[i] / 10) * 10;
                const g = Math.round(imageData[i + 1] / 10) * 10;
                const b = Math.round(imageData[i + 2] / 10) * 10;
                const hex = `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
                colorCounts[hex] = (colorCounts[hex] || 0) + 1;
            }
            return Object.entries(colorCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([color]) => color);
        };

        const extractPaletteFromImage = (file) => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();
                reader.onload = (e) => { img.src = e.target.result; };
                img.onload = () => resolve(processImage(img));
                img.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

        const extractPaletteFromUrl = (url) => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try { resolve(processImage(img)); }
                    catch (e) { reject(new Error('CORS restriction: Cannot extract colors from this URL.')); }
                };
                img.onerror = () => reject(new Error('Failed to load image. Check the URL and try again.'));
                img.src = url;
            });
        };

        // --- Components ---

        const ColorTile = ({ color, label, size = 'md' }) => {
            const [copied, setCopied] = useState(false);
            const handleCopy = () => {
                navigator.clipboard.writeText(color);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };
            const swatchClasses = { sm: 'w-12 h-12', md: 'w-16 h-16', lg: 'w-20 h-20' };
            return (
                <div className="flex flex-col items-center gap-2 group">
                    <div
                        className={`${swatchClasses[size]} rounded-2xl border border-gray-200 shadow-sm cursor-pointer transition-all duration-200 hover:scale-105 active:scale-95 group-hover:shadow-md relative overflow-hidden`}
                        style={{ backgroundColor: color }}
                        onClick={handleCopy}
                        title="Click to copy color"
                    >
                        {copied && (
                            <div className="absolute inset-0 flex items-center justify-center bg-black/10 backdrop-blur-[2px]">
                                <svg className="w-6 h-6 text-white drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />
                                </svg>
                            </div>
                        )}
                    </div>
                    <div className="flex flex-col items-center w-full">
                        {label && <span className="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1">{label}</span>}
                        <button
                            onClick={handleCopy}
                            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-xs font-mono font-bold transition-all hover:bg-gray-50 hover:border-gray-300 active:bg-gray-100 ${copied ? 'text-emerald-600 border-emerald-200 bg-emerald-50' : 'text-gray-700'}`}
                        >
                            {color.toUpperCase()}
                            {!copied ? (
                                <svg className="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                </svg>
                            ) : (
                                <span className="text-[9px] font-bold uppercase">Copied</span>
                            )}
                        </button>
                    </div>
                </div>
            );
        };

        const PrivacyPolicy = () => (
            <div className="max-w-3xl mx-auto py-12">
                <h1 className="text-4xl font-extrabold text-gray-900 mb-8">Privacy Policy</h1>
                <div className="prose prose-emerald text-gray-700 space-y-6">
                    <p className="text-sm text-gray-500 uppercase tracking-widest font-semibold">Last Updated: October 2023</p>
                    <section>
                        <h2 className="text-2xl font-bold text-gray-900 mt-8 mb-4">1. Information We Collect</h2>
                        <p>ColorPickerTool is designed as a client-side utility. We do not collect, store, or transmit any personal data or images you upload to our servers. All image processing happens locally within your web browser.</p>
                    </section>
                    <section>
                        <h2 className="text-2xl font-bold text-gray-900 mt-8 mb-4">2. Security</h2>
                        <p>Since we do not collect personal information, the risk of data breaches on our end is non-existent. However, we advise users to maintain standard security practices on their own devices.</p>
                    </section>
                </div>
            </div>
        );

        const ContactUs = () => {
            const [submitted, setSubmitted] = useState(false);
            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
            };
            if (submitted) return (
                <div className="max-w-xl mx-auto py-20 text-center">
                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
                    </div>
                    <h1 className="text-3xl font-bold text-gray-900 mb-4">Message Sent!</h1>
                    <button onClick={() => setSubmitted(false)} className="px-6 py-3 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700 transition-colors">Send Another</button>
                </div>
            );
            return (
                <div className="max-w-xl mx-auto py-12">
                    <h1 className="text-4xl font-extrabold text-gray-900 mb-4 text-center">Contact Us</h1>
                    <form onSubmit={handleSubmit} className="space-y-6 bg-white border border-gray-200 p-8 rounded-3xl shadow-sm mt-8">
                        <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                            <input type="email" required className="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all" placeholder="email@example.com" />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Message</label>
                            <textarea required rows="5" className="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all" placeholder="How can we help?" />
                        </div>
                        <button type="submit" className="w-full py-4 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition-all">Send Message</button>
                    </form>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [color, setColor] = useState('#10b981');
            const [palette, setPalette] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [source, setSource] = useState('upload');
            const [url, setUrl] = useState('');
            const [error, setError] = useState(null);

            const navigate = (v) => { setView(v); window.scrollTo({top: 0, behavior: 'smooth'}); };
            const handleCopy = (v) => {
                navigator.clipboard.writeText(v);
            };
            const rgbValue = hexToRgb(color);

            const handleFile = async (e) => {
                const f = e.target.files[0];
                if (!f) return;
                setIsProcessing(true); setError(null);
                try { const p = await extractPaletteFromImage(f); setPalette(p); }
                catch (e) { setError('Failed to process image file.'); }
                finally { setIsProcessing(false); }
            };

            const handleUrlSubmit = async (e) => {
                e.preventDefault();
                if (!url.trim()) return;
                setIsProcessing(true); setError(null);
                try { const p = await extractPaletteFromUrl(url); setPalette(p); }
                catch (e) { setError(e.message || 'Failed to extract colors.'); }
                finally { setIsProcessing(false); }
            };

            const renderHome = () => (
                <>
                    <section className="text-center mb-16">
                        <h1 className="text-4xl md:text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">Online Color Picker & Palette Generator</h1>
                        <p className="text-lg text-gray-600 max-w-2xl mx-auto font-medium">Pick colors, generate palettes from images, and copy HEX or RGB codes instantly.</p>
                    </section>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-20">
                        <div className="lg:col-span-7 bg-white p-6 md:p-10 border border-gray-200 rounded-[2.5rem] shadow-sm">
                            <div className="flex items-center justify-between mb-8">
                                <h3 className="text-2xl font-bold text-gray-900">Color Picker</h3>
                                <div className="flex items-center gap-2 text-sm text-gray-400 font-medium">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    Live Preview
                                </div>
                            </div>
                            <div className="flex flex-col md:flex-row gap-10">
                                <div className="flex-1">
                                    <div className="relative aspect-square w-full max-w-[280px] mx-auto group">
                                        <input type="color" value={color} onChange={(e) => setColor(e.target.value)} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                                        <div className="w-full h-full rounded-[2rem] border-8 border-white shadow-2xl ring-1 ring-gray-100 transition-all duration-300 group-hover:scale-[1.02]" style={{ backgroundColor: color }} />
                                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 group-hover:opacity-100 transition-all duration-300 scale-95 group-hover:scale-100">
                                            <span className="px-5 py-2.5 bg-black/60 text-white rounded-full text-sm font-bold backdrop-blur-md shadow-xl">Click to Change</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex-1 flex flex-col justify-center gap-5">
                                    <div className="space-y-1.5">
                                        <label className="text-[10px] text-gray-400 font-black uppercase tracking-[0.2em]">Hex Format</label>
                                        <div className="relative">
                                            <input readOnly value={color.toUpperCase()} className="w-full pl-4 pr-12 py-4 bg-gray-50 border border-gray-200 rounded-2xl font-mono text-xl font-bold text-gray-800" />
                                            <button onClick={() => handleCopy(color)} className="absolute right-2 top-2 bottom-2 aspect-square flex items-center justify-center bg-white border border-gray-200 rounded-xl text-gray-400 hover:text-emerald-600 transition-all"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg></button>
                                        </div>
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-[10px] text-gray-400 font-black uppercase tracking-[0.2em]">RGB Format</label>
                                        <div className="relative">
                                            <input readOnly value={rgbValue} className="w-full pl-4 pr-12 py-4 bg-gray-50 border border-gray-200 rounded-2xl font-mono text-lg font-bold text-gray-800" />
                                            <button onClick={() => handleCopy(rgbValue)} className="absolute right-2 top-2 bottom-2 aspect-square flex items-center justify-center bg-white border border-gray-200 rounded-xl text-gray-400 hover:text-emerald-600 transition-all"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-5 bg-white p-6 md:p-10 border border-gray-200 rounded-[2.5rem] shadow-sm">
                            <div className="flex items-center justify-between mb-8">
                                <h3 className="text-2xl font-bold text-gray-900">Image Palette</h3>
                                <div className="flex bg-gray-100 p-1 rounded-xl">
                                    <button onClick={() => setSource('upload')} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${source === 'upload' ? 'bg-white text-emerald-600 shadow-sm' : 'text-gray-500'}`}>File</button>
                                    <button onClick={() => setSource('url')} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${source === 'url' ? 'bg-white text-emerald-600 shadow-sm' : 'text-gray-500'}`}>URL</button>
                                </div>
                            </div>
                            <div className="flex flex-col h-full">
                                {source === 'upload' ? (
                                    <label className="group relative flex flex-col items-center justify-center h-44 px-6 bg-gray-50 border-2 border-gray-200 border-dashed rounded-[1.5rem] cursor-pointer hover:border-emerald-300 transition-all">
                                        <div className="flex flex-col items-center gap-3">
                                            <div className="w-12 h-12 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-gray-400 group-hover:text-emerald-500 shadow-sm">
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                            </div>
                                            <span className="font-bold text-gray-600">{isProcessing ? 'Analyzing...' : 'Upload Image'}</span>
                                        </div>
                                        <input type="file" accept="image/*" onChange={handleFile} className="hidden" />
                                    </label>
                                ) : (
                                    <form onSubmit={handleUrlSubmit} className="flex flex-col gap-3">
                                        <input type="url" required placeholder="https://example.com/photo.jpg" value={url} onChange={(e) => setUrl(e.target.value)} className="w-full px-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:ring-2 focus:ring-emerald-500/20 outline-none" />
                                        <button disabled={isProcessing} className="w-full py-4 bg-emerald-600 text-white font-bold rounded-2xl hover:bg-emerald-700 active:scale-[0.98] transition-all">{isProcessing ? 'Extracting...' : 'Extract Colors'}</button>
                                    </form>
                                )}
                                {error && <p className="text-xs text-red-500 font-bold bg-red-50 p-3 rounded-xl mt-3">{error}</p>}
                                <div className="flex flex-wrap justify-center gap-3 mt-6">
                                    {palette.map((c, i) => <ColorTile key={i} color={c} size="sm" />)}
                                </div>
                            </div>
                        </div>
                    </div>

                    <section className="mb-20">
                        <h2 className="text-3xl font-bold text-center mb-12">How It Works</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {[{t:'1', h:'Pick a color', s:'Use the picker or upload an image source'}, {t:'2', h:'Get Values', s:'Instant conversion to HEX and RGB values'}, {t:'3', h:'Copy & Use', s:'One-click copy for your project designs'}].map(f => (
                                <div key={f.t} className="text-center p-8 bg-white border border-gray-100 rounded-3xl transition-transform hover:-translate-y-1">
                                    <div className="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center font-black text-2xl mx-auto mb-6">{f.t}</div>
                                    <h4 className="text-xl font-bold mb-2">{f.h}</h4>
                                    <p className="text-gray-600">{f.s}</p>
                                </div>
                            ))}
                        </div>
                    </section>

                    <section className="bg-white border border-gray-100 p-10 rounded-[2.5rem] mb-20 prose prose-emerald max-w-none">
                        <h2 className="text-3xl font-bold text-gray-900 mb-6">Master Your Design with Professional Color Tools</h2>
                        <p className="text-lg">Our <strong>online color picker</strong> is engineered for precision and speed. Whether you need a specific <strong>hex color picker</strong> for CSS or want to <strong>pick color from image</strong> assets to build a brand identity, we provide the ultimate developer utility.</p>
                        <p className="text-lg">With our advanced <strong>color palette generator</strong>, creating cohesive visual designs becomes effortless. Extract dominant <strong>rgb color codes</strong> from any inspiration and ensure your project looks stunning across all screens.</p>
                    </section>

                    <section className="mb-20">
                        <h2 className="text-3xl font-bold text-center mb-12">Frequently Asked Questions</h2>
                        <div className="max-w-3xl mx-auto space-y-4">
                            {[
                                {q: 'Is this color picker free?', a: 'Yes, our tool is 100% free to use with no registration required.'},
                                {q: 'Can I extract colors from images?', a: 'Absolutely! You can upload a local file or provide an image URL to get a dominant palette instantly.'},
                                {q: 'What formats are supported?', a: 'We support standard HEX and RGB formats used by web and app developers.'},
                                {q: 'Is it mobile-friendly?', a: 'Yes, ColorPickerTool is fully optimized for all smartphones and tablets.'}
                            ].map((f, i) => (
                                <details key={i} className="group border border-gray-200 rounded-2xl bg-white overflow-hidden transition-all duration-300">
                                    <summary className="p-6 cursor-pointer font-bold text-gray-900 list-none hover:bg-gray-50 flex justify-between items-center transition-colors">
                                        {f.q} 
                                        <span className="transition-transform duration-300 group-open:rotate-180">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                                        </span>
                                    </summary>
                                    <div className="px-6 pb-6 text-gray-600 leading-relaxed">{f.a}</div>
                                </details>
                            ))}
                        </div>
                    </section>
                </>
            );

            return (
                <div className="min-h-screen">
                    <header className="border-b border-gray-100 py-6 sticky top-0 bg-white/70 backdrop-blur-xl z-50">
                        <div className="max-w-5xl mx-auto px-6 flex justify-between items-center">
                            <button onClick={() => navigate('home')} className="text-2xl font-black text-gray-900 hover:text-emerald-600 transition-colors flex items-center gap-2">
                                <div className="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center">
                                    <div className="w-3 h-3 rounded-full bg-white"></div>
                                </div>
                                ColorPickerTool
                            </button>
                            <nav className="flex gap-8 text-sm font-bold text-gray-500">
                                <button onClick={() => navigate('home')} className={`hover:text-emerald-600 transition-colors ${view === 'home' ? 'text-emerald-600' : ''}`}>Picker</button>
                                <button onClick={() => navigate('privacy')} className={`hover:text-emerald-600 transition-colors ${view === 'privacy' ? 'text-emerald-600' : ''}`}>Privacy</button>
                                <button onClick={() => navigate('contact')} className={`hover:text-emerald-600 transition-colors ${view === 'contact' ? 'text-emerald-600' : ''}`}>Contact</button>
                            </nav>
                        </div>
                    </header>
                    <main className="max-w-5xl mx-auto px-6 py-12 md:py-20">
                        {view === 'privacy' ? <PrivacyPolicy /> : view === 'contact' ? <ContactUs /> : renderHome()}
                    </main>
                    <footer className="border-t border-gray-100 py-16 text-center bg-white">
                        <div className="max-w-5xl mx-auto px-6">
                            <div className="flex justify-center gap-8 text-sm font-bold text-gray-400 mb-8">
                                <button onClick={() => navigate('home')} className="hover:text-emerald-600 transition-colors">Home</button>
                                <button onClick={() => navigate('privacy')} className="hover:text-emerald-600 transition-colors">Privacy</button>
                                <button onClick={() => navigate('contact')} className="hover:text-emerald-600 transition-colors">Support</button>
                            </div>
                            <div className="flex flex-col items-center gap-4">
                                <div className="w-10 h-1 border-t-2 border-gray-100"></div>
                                <p className="text-gray-400 text-xs font-bold uppercase tracking-widest">© 2026 ColorPickerTool — Built for Designers</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
